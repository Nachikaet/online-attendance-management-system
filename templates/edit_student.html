{% extends "base.html" %}{% block title %}Edit student{% endblock %}
{% block content %}<h1 class="h2 page-title mb-3">Edit student</h1><div class="card p-4"><form method="post" class="row g-3">
<div class="col-12 col-md-3"><label class="form-label">Admission number</label><input class="form-control" name="admission_no" value="{{ student.admission_no }}" required></div><div class="col-12 col-md-3"><label class="form-label">Name</label><input class="form-control" name="name" value="{{ student.name }}" required></div><div class="col-6 col-md-3"><label class="form-label">Class</label><input class="form-control" name="class_name" value="{{ student.class_name }}" required></div><div class="col-6 col-md-3"><label class="form-label">Section</label><input class="form-control" name="section" value="{{ student.section }}" required></div><div class="col-12"><button class="btn btn-primary">Save changes</button> <a class="btn btn-outline-secondary" href="{{ url_for('students') }}">Cancel</a></div></form></div>{% endblock %}
