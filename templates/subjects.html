{% extends "base.html" %}{% block title %}Subjects{% endblock %}
{% block content %}<h1 class="h2 page-title mb-3">Subjects</h1><div class="card p-4 mb-4"><form method="post" class="row g-2"><div class="col-12 col-md-9"><input class="form-control" name="name" placeholder="Subject name" required></div><div class="col-12 col-md-3 d-grid"><button class="btn btn-primary">Add subject</button></div></form></div><div class="card p-4"><ul class="list-group list-group-flush">{% for s in subjects %}<li class="list-group-item">{{ s.name }}</li>{% else %}<li class="list-group-item">No subjects added.</li>{% endfor %}</ul></div>{% endblock %}
